<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Harmony & WCAG Contrast Studio</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --bg: #090d16;
      --bg-card: rgba(18, 26, 44, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: radial-gradient(circle at 50% 0%, #371b58 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.15rem;
    }
    .logo-badge {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .picker-row {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="color"] {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }
    .harmony-select {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      cursor: pointer;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .color-card {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }
    .color-card:hover { transform: translateY(-2px); }
    .color-swatch {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .color-info {
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
    }
    .wcag-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) { .wcag-grid { grid-template-columns: 1fr; } }
    .wcag-box {
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .wcag-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #7ee787;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 14px;
      resize: vertical;
      min-height: 120px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span>🎨 Color Harmony Studio</span>
      <span class="logo-badge">WCAG & Palette</span>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-title">Base Color & Harmony Mode</div>
      <div class="picker-row">
        <input type="color" id="baseColorInput" value="#3b82f6">
        <select class="harmony-select" id="harmonyMode">
          <option value="complementary">Complementary</option>
          <option value="triadic">Triadic</option>
          <option value="analogous">Analogous</option>
          <option value="monochromatic">Monochromatic Tints & Shades</option>
        </select>
        <span style="font-family: var(--font-mono); font-size: 0.95rem; color: var(--text-muted);" id="baseHexDisplay">#3b82f6</span>
      </div>

      <div class="palette-grid" id="paletteContainer"></div>
    </div>

    <div class="panel">
      <div class="panel-title">WCAG 2.1 Contrast Ratio Analysis</div>
      <div class="wcag-grid">
        <div class="wcag-box" id="contrastDarkBox" style="background: #090d16; color: #f1f5f9;">
          <div style="font-weight: 700;">Text on Dark Surface (#090d16)</div>
          <div id="ratioDarkText">Contrast: 0.0:1</div>
          <div id="badgeDark"></div>
        </div>

        <div class="wcag-box" id="contrastLightBox" style="background: #f8fafc; color: #0f172a;">
          <div style="font-weight: 700;">Text on Light Surface (#f8fafc)</div>
          <div id="ratioLightText">Contrast: 0.0:1</div>
          <div id="badgeLight"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Export CSS Variables</div>
      <textarea id="cssExport" readonly></textarea>
    </div>
  </main>

  <script>
    function hexToHsl(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if (max === min) {
        h = s = 0;
      } else {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }

    function hslToHex(h, s, l) {
      s /= 100;
      l /= 100;
      let c = (1 - Math.abs(2 * l - 1)) * s,
          x = c * (1 - Math.abs((h / 60) % 2 - 1)),
          m = l - c / 2,
          r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      r = Math.round((r + m) * 255).toString(16).padStart(2, '0');
      g = Math.round((g + m) * 255).toString(16).padStart(2, '0');
      b = Math.round((b + m) * 255).toString(16).padStart(2, '0');
      return `#${r}${g}${b}`;
    }

    function getLuminance(hex) {
      const rgb = [
        parseInt(hex.slice(1, 3), 16) / 255,
        parseInt(hex.slice(3, 5), 16) / 255,
        parseInt(hex.slice(5, 7), 16) / 255
      ].map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
      return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
    }

    function getContrastRatio(hex1, hex2) {
      const lum1 = getLuminance(hex1);
      const lum2 = getLuminance(hex2);
      const brightest = Math.max(lum1, lum2);
      const darkest = Math.min(lum1, lum2);
      return (brightest + 0.05) / (darkest + 0.05);
    }

    function update() {
      const hex = document.getElementById('baseColorInput').value;
      const mode = document.getElementById('harmonyMode').value;
      document.getElementById('baseHexDisplay').textContent = hex;

      const [h, s, l] = hexToHsl(hex);
      let colors = [];

      if (mode === 'complementary') {
        colors = [
          { name: 'Base Color', hex: hex },
          { name: 'Complement', hex: hslToHex((h + 180) % 360, s, l) },
          { name: 'Light Tint', hex: hslToHex(h, s, Math.min(90, l + 25)) },
          { name: 'Dark Shade', hex: hslToHex(h, s, Math.max(10, l - 25)) }
        ];
      } else if (mode === 'triadic') {
        colors = [
          { name: 'Base Color', hex: hex },
          { name: 'Triad 1', hex: hslToHex((h + 120) % 360, s, l) },
          { name: 'Triad 2', hex: hslToHex((h + 240) % 360, s, l) },
          { name: 'Accent', hex: hslToHex((h + 60) % 360, s, l) }
        ];
      } else if (mode === 'analogous') {
        colors = [
          { name: 'Analogous -30°', hex: hslToHex((h - 30 + 360) % 360, s, l) },
          { name: 'Base Color', hex: hex },
          { name: 'Analogous +30°', hex: hslToHex((h + 30) % 360, s, l) },
          { name: 'Analogous +60°', hex: hslToHex((h + 60) % 360, s, l) }
        ];
      } else {
        colors = [
          { name: '50 (Lightest)', hex: hslToHex(h, s, 95) },
          { name: '200 (Light)', hex: hslToHex(h, s, 75) },
          { name: '500 (Base)', hex: hex },
          { name: '800 (Dark)', hex: hslToHex(h, s, 30) }
        ];
      }

      const container = document.getElementById('paletteContainer');
      container.innerHTML = colors.map(c => `
        <div class="color-card">
          <div class="color-swatch" style="background: ${c.hex}; color: ${getLuminance(c.hex) > 0.4 ? '#000' : '#fff'};" onclick="navigator.clipboard.writeText('${c.hex}').then(() => alert('Copied ${c.hex}'))">
            ${c.hex.toUpperCase()}
          </div>
          <div class="color-info">
            <span>${c.name}</span>
            <span>Click to copy</span>
          </div>
        </div>
      `).join('');

      // Contrast calculations
      const darkRatio = getContrastRatio(hex, '#090d16').toFixed(2);
      const lightRatio = getContrastRatio(hex, '#f8fafc').toFixed(2);

      document.getElementById('ratioDarkText').textContent = `Contrast Ratio: ${darkRatio}:1`;
      document.getElementById('ratioLightText').textContent = `Contrast Ratio: ${lightRatio}:1`;

      document.getElementById('badgeDark').innerHTML = darkRatio >= 4.5
        ? `<span class="wcag-badge badge-pass">✓ PASS WCAG AA (${darkRatio}:1)</span>`
        : `<span class="wcag-badge badge-fail">✗ FAIL WCAG AA (${darkRatio}:1)</span>`;

      document.getElementById('badgeLight').innerHTML = lightRatio >= 4.5
        ? `<span class="wcag-badge badge-pass">✓ PASS WCAG AA (${lightRatio}:1)</span>`
        : `<span class="wcag-badge badge-fail">✗ FAIL WCAG AA (${lightRatio}:1)</span>`;

      // Export CSS
      let css = ':root {\n';
      colors.forEach((c, idx) => {
        const varName = c.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        css += `  --color-${varName}: ${c.hex};\n`;
      });
      css += '}';
      document.getElementById('cssExport').value = css;
    }

    document.getElementById('baseColorInput').addEventListener('input', update);
    document.getElementById('harmonyMode').addEventListener('change', update);

    update();
  </script>
</body>
</html>
